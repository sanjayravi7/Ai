# CI for the repository-root vulnerability-data project (src/, tests/).
#
# VULNOVA is a separate project under vulnova_product/ and has its own
# workflows: vulnova-unit-tests.yml and vulnova-browser.yml. Changes confined
# to vulnova_product/ therefore do not run this workflow.

name: Python package

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "vulnova_product/**"
      - ".github/workflows/vulnova-unit-tests.yml"
      - ".github/workflows/vulnova-browser.yml"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "vulnova_product/**"
      - ".github/workflows/vulnova-unit-tests.yml"
      - ".github/workflows/vulnova-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        python -m pip install -r requirements.txt
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names.
        flake8 src tests inspect_data.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all remaining findings as warnings.
        flake8 src tests inspect_data.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        # `python -m pytest` puts the repository root on sys.path, so tests can
        # import the local `src` and `tests` packages. Bare `pytest` does not,
        # which previously produced collection errors (exit code 2).
        # Only the root project's tests are selected; VULNOVA has its own CI.
        python -m pytest tests -q
