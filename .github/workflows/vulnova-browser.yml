name: VULNOVA browser smoke test

on:
  pull_request:
    paths:
      - 'vulnova_product/**'
      - '.github/workflows/vulnova-browser.yml'
  push:
    branches: [main]
    paths:
      - 'vulnova_product/**'
      - '.github/workflows/vulnova-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: vulnova_product/requirements-browser.txt
      - name: Install browser-check dependency
        run: python -m pip install -r vulnova_product/requirements-browser.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run real-browser UI checks
        run: python vulnova_product/tools/ui_browser_check.py
