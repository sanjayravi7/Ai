name: VULNOVA unit tests

# Lightweight VULNOVA test job: Python 3.11, pytest only.
#
# The suite uses temporary SQLite stores created by tests/conftest.py and a
# synthetic Phase 2.3K fixture; it does not read build/vulnova.db or use the
# network. One readiness test re-runs the committed phase2.3k-export archive and
# compares the report digest. Do not add a database build to this workflow unless
# it is made reproducible from committed inputs.
#
# There is deliberately no scheduled capture job. Prospective evidence (1.9)
# must be captured by an operator on a real schedule into a store outside the
# repository; a GitHub Actions cron that committed a daily EPSS file would turn
# an expiring artifact into repository history and make the workflow look like a
# durable archive. CI only exercises the offline surface.

on:
  pull_request:
    paths:
      - 'vulnova_product/**'
      - 'phase2.3k-export/**'
      - '.github/workflows/vulnova-unit-tests.yml'
  push:
    branches: [main]
    paths:
      - 'vulnova_product/**'
      - 'phase2.3k-export/**'
      - '.github/workflows/vulnova-unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulnova-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Unit tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: vulnova_product/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r vulnova_product/requirements.txt
      - name: Run unit tests
        working-directory: vulnova_product
        run: python -m pytest -q

      # Offline integrity check of the committed 1.7 acquisition archive: it
      # re-hashes the stored bytes and re-derives access provenance. It does not
      # use the network. Do NOT add --require-verified here: the committed run
      # truthfully reports the EPSS source as UNAVAILABLE, and that is a finding,
      # not a build failure.
      - name: Verify the committed acquisition archive offline
        working-directory: vulnova_product
        run: python -m vulnova.acquisition verify

      # Offline verification of the committed 1.8 refresh report: it recomputes
      # the refresh digest, re-hashes the refreshed catalog, re-checks the
      # maturity invariant (no block may claim maturity before its date) and
      # re-hashes all seven sealed 1.7 artifacts. It does not use the network.
      # Do NOT make this gated on evidence completeness: the committed run
      # truthfully reports the final block as NOT_MATURED and EPSS as
      # UNAVAILABLE, and those are findings, not build failures.
      - name: Verify the committed 1.8 refresh report offline
        working-directory: vulnova_product
        run: python -m vulnova.refresh verify

      # Prospective capture (1.9) has no committed store: evidence is captured
      # outside the repository, and an empty store is the honest state of a
      # fresh checkout. These steps exercise the offline surface only. Do NOT
      # add a `prospective capture` step: it would make CI depend on CISA/FIRST
      # reachability, and a daily EPSS file captured here would be a transient
      # artifact presented as an archive.
      - name: Prospective capture CLI smoke test (offline)
        working-directory: vulnova_product
        run: python -m vulnova.prospective --help

      - name: An empty prospective store is reported as empty, not verified
        working-directory: vulnova_product
        run: |
          python -m vulnova.prospective report --store "$RUNNER_TEMP/empty-prospective" | grep -q "empty store"
          python -c "
          from vulnova.prospective.verify import verify_store
          result = verify_store('$RUNNER_TEMP/empty-prospective')
          assert result['status'] == 'BLOCKED', result['status']
          assert result['captures'] == 0, result['captures']
          assert result['network_used'] is False
          print('empty store: BLOCKED, 0 captures, no network')
          "
