name: VULNOVA unit tests

# Lightweight VULNOVA test job: Python 3.11, pytest only.
#
# The suite uses temporary SQLite stores created by tests/conftest.py and a
# synthetic Phase 2.3K fixture; it does not read build/vulnova.db or use the
# network. One readiness test re-runs the committed phase2.3k-export archive and
# compares the report digest. Do not add a database build to this workflow unless
# it is made reproducible from committed inputs.

on:
  pull_request:
    paths:
      - 'vulnova_product/**'
      - 'phase2.3k-export/**'
      - '.github/workflows/vulnova-unit-tests.yml'
  push:
    branches: [main]
    paths:
      - 'vulnova_product/**'
      - 'phase2.3k-export/**'
      - '.github/workflows/vulnova-unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulnova-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Unit tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: vulnova_product/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r vulnova_product/requirements.txt
      - name: Run unit tests
        working-directory: vulnova_product
        run: python -m pytest -q

      # Offline integrity check of the committed 1.7 acquisition archive: it
      # re-hashes the stored bytes and re-derives access provenance. It does not
      # use the network. Do NOT add --require-verified here: the committed run
      # truthfully reports the EPSS source as UNAVAILABLE, and that is a finding,
      # not a build failure.
      - name: Verify the committed acquisition archive offline
        working-directory: vulnova_product
        run: python -m vulnova.acquisition verify

      # Offline verification of the committed 1.8 refresh report: it recomputes
      # the refresh digest, re-hashes the refreshed catalog, re-checks the
      # maturity invariant (no block may claim maturity before its date) and
      # re-hashes all seven sealed 1.7 artifacts. It does not use the network.
      # Do NOT make this gated on evidence completeness: the committed run
      # truthfully reports the final block as NOT_MATURED and EPSS as
      # UNAVAILABLE, and those are findings, not build failures.
      - name: Verify the committed 1.8 refresh report offline
        working-directory: vulnova_product
        run: python -m vulnova.refresh verify
