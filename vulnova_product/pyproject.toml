[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnova"
version = "1.9.1"
description = "VULNOVA vulnerability triage console, evaluation-readiness, historical acquisition, maturity refresh and prospective evidence capture (1.9)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
vulnova-web = "vulnova.web:main"
vulnova-ingest = "vulnova.ingest:main"
vulnova-readiness = "vulnova.evaluation.cli:main"
vulnova-acquire = "vulnova.acquisition.cli:main"
vulnova-refresh = "vulnova.refresh.cli:main"
vulnova-prospective = "vulnova.prospective.cli:main"

[tool.setuptools]
packages = [
    "vulnova",
    "vulnova.sources",
    "vulnova.evaluation",
    "vulnova.acquisition",
    "vulnova.acquisition.sources",
    "vulnova.refresh",
    "vulnova.prospective",
]

[tool.setuptools.package-data]
vulnova = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning"]
